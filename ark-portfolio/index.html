<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ARK</title>
<style>
html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#fff;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;}
*{box-sizing:border-box;}

/* LOADING */
#loading{position:fixed;inset:0;background:#fff;z-index:999;display:flex;align-items:center;justify-content:center;transition:opacity .4s ease;}
#loading.out{opacity:0;pointer-events:none;}
.ld{width:4px;height:4px;border-radius:50%;background:#ccc;margin:0 3px;animation:ld 1.2s ease-in-out infinite;}
.ld:nth-child(2){animation-delay:.2s;}.ld:nth-child(3){animation-delay:.4s;}
@keyframes ld{0%,80%,100%{transform:scale(.5);opacity:.2;}40%{transform:scale(1);opacity:1;}}

/* INTRO */
#intro{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;z-index:100;transition:background .35s ease,opacity .6s ease;}
#intro.hovered{background:#000;}
#intro.out{opacity:0;pointer-events:none;}
#logo-wrap{width:clamp(90px,10vw,130px);height:clamp(90px,10vw,130px);border:.5px solid #111;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;transition:border-color .35s ease;animation:scaleIn .9s cubic-bezier(.22,1,.36,1) both;}
#intro.hovered #logo-wrap{border-color:#fff;}
#logo-img{width:100%;height:100%;object-fit:contain;display:none;}
#logo-img.on{display:block;}
#logo-img-inv{width:100%;height:100%;object-fit:contain;display:none;}
#intro.hovered #logo-img-inv.on{display:block;}
#intro.hovered #logo-img.on{display:none;}
#logo-text{font-size:clamp(20px,2.5vw,30px);font-weight:300;letter-spacing:.24em;color:#111;user-select:none;transition:color .35s ease;}
#intro.hovered #logo-text{color:#fff;}
@keyframes scaleIn{from{opacity:0;transform:scale(.6);}to{opacity:1;transform:scale(1);}}

/* MAP */
#map{position:fixed;inset:0;opacity:0;pointer-events:none;transition:opacity .5s ease;}
#map.visible{opacity:1;pointer-events:all;}
#topbar{position:absolute;top:0;left:0;right:0;height:44px;display:flex;align-items:center;padding:0 28px;border-bottom:.5px solid #ebebeb;background:#fff;z-index:20;}
#tb-logo{font-size:13px;font-weight:400;letter-spacing:.22em;color:#111;text-transform:uppercase;display:flex;align-items:center;gap:10px;}
#tb-logo-img{height:22px;width:auto;display:none;object-fit:contain;}
#tb-logo-img.on{display:block;}
#canvas{position:absolute;top:44px;left:0;right:0;bottom:0;cursor:grab;overflow:hidden;background:#fff;}
#canvas.dragging{cursor:grabbing;}
#world{position:absolute;width:3000px;height:2000px;top:0;left:0;transform-origin:0 0;}

.proj{position:absolute;cursor:pointer;}
.proj-inner{position:relative;overflow:hidden;}
.proj-img,.proj-video{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s ease;}
.proj:hover .proj-img{transform:scale(1.04);}
.proj-overlay{position:absolute;inset:0;background:rgba(255,255,255,.93);display:flex;flex-direction:column;justify-content:flex-end;padding:18px;opacity:0;transition:opacity .2s;pointer-events:none;}
.proj:hover .proj-overlay{opacity:1;}
.ov-cat{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#888;margin-bottom:5px;}
.ov-title{font-size:clamp(13px,1.2vw,16px);font-weight:400;color:#000;line-height:1.2;margin-bottom:3px;}
.ov-year{font-size:10px;color:#bbb;letter-spacing:.1em;}

#zoom-ctrl{position:absolute;bottom:24px;right:24px;display:flex;gap:4px;z-index:20;}
.zbtn{width:30px;height:30px;border:.5px solid #e0e0e0;background:#fff;color:#aaa;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .15s,color .15s;}
.zbtn:hover{border-color:#111;color:#111;}

/* DETAIL */
#detail{position:fixed;inset:0;background:#fff;z-index:200;opacity:0;pointer-events:none;transition:opacity .4s ease;overflow-y:auto;}
#detail.visible{opacity:1;pointer-events:all;}
#detail-bar{position:sticky;top:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:.5px solid #ebebeb;background:#fff;z-index:10;}
#detail-back{font-size:11px;letter-spacing:.12em;color:#bbb;cursor:pointer;text-transform:uppercase;background:none;border:none;font-family:inherit;transition:color .15s;display:flex;align-items:center;gap:8px;}
#detail-back:hover{color:#000;}
#detail-bar-logo{font-size:13px;letter-spacing:.22em;color:#111;text-transform:uppercase;}
#detail-body{padding:clamp(24px,4vw,56px) clamp(24px,5vw,80px) 100px;max-width:1100px;margin:0 auto;}
#d-title{font-size:clamp(20px,3vw,32px);font-weight:300;letter-spacing:.02em;color:#000;margin-bottom:12px;}
#d-intro{font-size:13px;line-height:1.85;color:#666;max-width:560px;margin-bottom:40px;}
#d-divider{width:100%;height:.5px;background:#ebebeb;margin-bottom:28px;}
#d-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.d-slot{background:#f4f4f4;overflow:hidden;}
.d-slot.wide{grid-column:span 2;}
.d-slot.landscape{aspect-ratio:16/9;}
.d-slot.square{aspect-ratio:1;}
.d-slot.tall{aspect-ratio:3/4;}
.d-slot img,.d-slot video{width:100%;height:100%;object-fit:cover;display:block;}
.d-slot video{background:#000;}
</style>
</head>
<body>

<div id="loading"><div class="ld"></div><div class="ld"></div><div class="ld"></div></div>

<div id="intro">
  <div id="logo-wrap"
    onmouseenter="this.closest('#intro').classList.add('hovered')"
    onmouseleave="this.closest('#intro').classList.remove('hovered')"
    onclick="enterPortfolio()">
    <img id="logo-img" alt=""/><img id="logo-img-inv" alt=""/>
    <span id="logo-text">ARK</span>
  </div>
</div>

<div id="map">
  <div id="topbar">
    <div id="tb-logo"><img id="tb-logo-img" alt=""/><span id="tb-logo-text">ARK</span></div>
  </div>
  <div id="canvas"><div id="world"></div></div>
  <div id="zoom-ctrl">
    <button class="zbtn" id="btn-in">+</button>
    <button class="zbtn" id="btn-out">−</button>
  </div>
</div>

<div id="detail">
  <div id="detail-bar">
    <button id="detail-back" onclick="closeDetail()">← Lavori</button>
    <div id="detail-bar-logo">ARK</div>
  </div>
  <div id="detail-body">
    <div id="d-title"></div>
    <div id="d-intro"></div>
    <div id="d-divider"></div>
    <div id="d-grid"></div>
  </div>
</div>

<script>
const SUPA_URL='https://whqpztxvubdfvjwsuhod.supabase.co';
const SUPA_KEY='sb_publishable_Jgk-m2H0m9XVG1QFQbUjcw_PTbVrDLk';
let PROJECTS=[],settings={};
let tx=-80,ty=-40,sc=0.72,drag=false,sx,sy,stx,sty,moved=false;
const world=document.getElementById('world'),canvas=document.getElementById('canvas');

async function supa(ep,opts={}){
  try{
    const r=await fetch(SUPA_URL+'/rest/v1/'+ep,{headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json',...(opts.headers||{})},method:opts.method||'GET',body:opts.body});
    if(!r.ok)return null;const t=await r.text();return t?JSON.parse(t):null;
  }catch(e){return null;}
}

function isVid(u){return u&&/\.(mp4|webm|ogg|mov)(\?|$)/i.test(u);}
function mkMedia(url,cls){
  if(isVid(url)){const v=document.createElement('video');v.src=url;v.autoplay=v.loop=v.muted=v.playsInline=true;v.className=cls;return v;}
  const i=document.createElement('img');i.src=url;i.alt='';i.className=cls;return i;
}

async function loadData(){
  const[projs,sets]=await Promise.all([supa('projects?select=*&order=created_at.asc'),supa('settings?select=*')]);
  PROJECTS=projs&&projs.length?projs:defaultProjects();
  if(sets)sets.forEach(s=>{settings[s.key]=s.value;});
  applySettings();
  document.getElementById('loading').classList.add('out');
}

function applySettings(){
  const name=settings['site_name']||'ARK';
  document.getElementById('tb-logo-text').textContent=name;
  document.getElementById('detail-bar-logo').textContent=name;
  document.title=name;
  if(settings['logo_url']){
    const u=settings['logo_url'];
    const li=document.getElementById('logo-img');li.src=u;li.classList.add('on');
    document.getElementById('logo-text').style.display='none';
    const tl=document.getElementById('tb-logo-img');tl.src=u;tl.classList.add('on');
    document.getElementById('tb-logo-text').style.display='none';
  }
  if(settings['logo_inv_url']){const l=document.getElementById('logo-img-inv');l.src=settings['logo_inv_url'];l.classList.add('on');}
}

function buildWorld(){
  world.innerHTML='';
  PROJECTS.forEach(p=>{
    const el=document.createElement('div');el.className='proj';
    el.style.cssText=`left:${p.x||100}px;top:${p.y||100}px;width:${p.w||200}px;`;
    const inner=document.createElement('div');inner.className='proj-inner';
    inner.style.cssText=`width:${p.w||200}px;height:${p.h||150}px;`;
    if(p.cover_url){inner.appendChild(mkMedia(p.cover_url,isVid(p.cover_url)?'proj-video':'proj-img'));}
    else{const ph=document.createElement('div');ph.style.cssText=`width:100%;height:100%;background:${p.bg||'#eee'};`;inner.appendChild(ph);}
    const ov=document.createElement('div');ov.className='proj-overlay';
    ov.innerHTML=`<div class="ov-cat">${p.cat||''}</div><div class="ov-title">${p.title||''}</div><div class="ov-year">${p.year||''}</div>`;
    inner.appendChild(ov);el.appendChild(inner);
    el.addEventListener('click',()=>{if(!moved)openDetail(p);});
    world.appendChild(el);
  });
}

function applyT(){world.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;}

function enterPortfolio(){
  document.getElementById('intro').classList.add('out');
  setTimeout(()=>{document.getElementById('intro').style.display='none';document.getElementById('map').classList.add('visible');buildWorld();applyT();},400);
}

function openDetail(p){
  document.getElementById('d-title').textContent=p.title||'';
  document.getElementById('d-intro').textContent=p.intro||'';
  const grid=document.getElementById('d-grid');grid.innerHTML='';
  let urls=[];try{urls=JSON.parse(p.gallery_urls||'[]');}catch(e){}
  let slots=[];try{slots=typeof p.slots==='string'?JSON.parse(p.slots||'[]'):(p.slots||[]);}catch(e){}
  const defs={'wide-landscape':'wide landscape','square':'square','tall':'tall','landscape':'landscape'};
  slots.forEach((type,i)=>{
    const slot=document.createElement('div');slot.className='d-slot '+(defs[type]||'square');
    if(urls[i])slot.appendChild(mkMedia(urls[i],''));
    else slot.style.background=p.bg||'#f0f0f0';
    grid.appendChild(slot);
  });
  document.getElementById('detail').scrollTop=0;
  document.getElementById('detail').classList.add('visible');
}
function closeDetail(){document.getElementById('detail').classList.remove('visible');}

canvas.addEventListener('mousedown',e=>{drag=true;moved=false;canvas.classList.add('dragging');sx=e.clientX;sy=e.clientY;stx=tx;sty=ty;});
window.addEventListener('mousemove',e=>{if(!drag)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>4||Math.abs(dy)>4)moved=true;tx=stx+dx;ty=sty+dy;applyT();});
window.addEventListener('mouseup',()=>{drag=false;canvas.classList.remove('dragging');});
canvas.addEventListener('wheel',e=>{e.preventDefault();sc=Math.max(.2,Math.min(3,sc+(e.deltaY>0?-.07:.07)));applyT();},{passive:false});
document.getElementById('btn-in').addEventListener('click',()=>{sc=Math.min(3,sc+.15);applyT();});
document.getElementById('btn-out').addEventListener('click',()=>{sc=Math.max(.2,sc-.15);applyT();});

function defaultProjects(){
  return[
    {id:'d1',title:'Rivista Forma',cat:'Editoriale',year:'2024',intro:'Art direction per una rivista di architettura e design.',cover_url:'',gallery_urls:'[]',slots:'["wide-landscape","square","square","wide-landscape"]',w:280,h:210,x:120,y:100,bg:'#e8e5e0'},
    {id:'d2',title:'Catalogo Sculture',cat:'Editoriale',year:'2023',intro:'Catalogo per una mostra di sculture contemporanee.',cover_url:'',gallery_urls:'[]',slots:'["wide-landscape","tall","tall"]',w:190,h:270,x:640,y:60,bg:'#f0ede8'},
    {id:'d3',title:'Film Doc Coste',cat:'Multimediale',year:'2023',intro:'Title sequence e motion graphics per documentario.',cover_url:'',gallery_urls:'[]',slots:'["wide-landscape","wide-landscape","square","square"]',w:360,h:230,x:200,y:560,bg:'#111'},
    {id:'d4',title:'Installazione Sonora',cat:'Multimediale',year:'2024',intro:'Visual per installazione in spazio urbano.',cover_url:'',gallery_urls:'[]',slots:'["wide-landscape","square","square","tall","tall"]',w:210,h:210,x:900,y:580,bg:'#0d0d0d'},
    {id:'d5',title:'Libro di Poesia',cat:'Editoriale',year:'2022',intro:'Progetto tipografico per raccolta poetica.',cover_url:'',gallery_urls:'[]',slots:'["tall","tall","wide-landscape","square","square"]',w:165,h:235,x:1280,y:520,bg:'#f8f8f8'},
    {id:'d6',title:'Motion Identity',cat:'Multimediale',year:'2023',intro:'Identità animata per festival culturale.',cover_url:'',gallery_urls:'[]',slots:'["wide-landscape","square","square","wide-landscape"]',w:270,h:190,x:1500,y:100,bg:'#0a0a0a'},
    {id:'d7',title:'Manifesto Tipo',cat:'Editoriale',year:'2024',intro:'Sperimentazione tipografica su grande formato.',cover_url:'',gallery_urls:'[]',slots:'["tall","tall","wide-landscape"]',w:195,h:280,x:1620,y:460,bg:'#f5f2ed'},
  ];
}
loadData();
</script>
</body>
</html>
