<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<link rel="stylesheet" href="univers.css"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>ARK</title>
<style>




html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#fff;font-family:'Univers',Arial,sans-serif;}
*{box-sizing:border-box;}

/* CURSORE */
body{cursor:none;}
#cur{position:fixed;top:0;left:0;width:8px;height:8px;background:#111;border-radius:50%;pointer-events:none;z-index:99999;transform:translate(-50%,-50%);transition:width .12s ease,height .12s ease,background .15s ease,box-shadow .15s ease;}
#cur.on-img{background:#fff;box-shadow:0 0 0 1.5px #111;}
#cur-tip{
  position:fixed;top:0;left:0;pointer-events:none;z-index:99998;
  background:#111;color:#fff;font-family:'Univers',Arial,sans-serif;
  font-size:11px;padding:7px 12px;opacity:0;
  transition:opacity .15s;white-space:nowrap;line-height:1.5;
}
#cur-tip.on{opacity:1;}
#ct-cat{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#aaa;margin-bottom:2px;}
#ct-title{font-weight:400;}
#ct-year{font-size:9px;color:#777;margin-top:1px;}

/* LOADING */
#loading{position:fixed;inset:0;background:#fff;z-index:9999;display:flex;align-items:center;justify-content:center;transition:opacity .4s;}
#loading.out{opacity:0;pointer-events:none;}
.ld{width:4px;height:4px;border-radius:50%;background:#ccc;margin:0 3px;animation:ld 1.2s ease-in-out infinite;}
.ld:nth-child(2){animation-delay:.2s;}.ld:nth-child(3){animation-delay:.4s;}
@keyframes ld{0%,80%,100%{transform:scale(.5);opacity:.2;}40%{transform:scale(1);opacity:1;}}

/* INTRO */
#intro{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;z-index:100;transition:background .35s,opacity .6s;}
#intro.hov{background:#000;}
#intro.out{opacity:0;pointer-events:none;}
#logo-wrap{width:clamp(90px,10vw,130px);height:clamp(90px,10vw,130px);border:.5px solid #111;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:border-color .35s;animation:scaleIn .9s cubic-bezier(.22,1,.36,1) both;}
#intro.hov #logo-wrap{border-color:#fff;}
#logo-img{width:100%;height:100%;object-fit:contain;display:none;}
#logo-img.on{display:block;}
#logo-img-inv{width:100%;height:100%;object-fit:contain;display:none;}
#intro.hov #logo-img-inv.on{display:block;}
#intro.hov #logo-img.on{display:none;}
#logo-text{font-size:clamp(20px,2.5vw,30px);font-weight:300;letter-spacing:.24em;color:#111;user-select:none;transition:color .35s;}
#intro.hov #logo-text{color:#fff;}
@keyframes scaleIn{from{opacity:0;transform:scale(.6);}to{opacity:1;transform:scale(1);}}

/* MAP */
#map{position:fixed;inset:0;opacity:0;pointer-events:none;transition:opacity .5s;}
#map.visible{opacity:1;pointer-events:all;}
#topbar{position:absolute;top:0;left:0;right:0;height:44px;display:flex;align-items:center;padding:0 24px;border-bottom:.5px solid #ebebeb;background:#fff;z-index:20;}
#tb-logo{font-size:12px;font-weight:400;letter-spacing:.22em;color:#111;text-transform:uppercase;display:flex;align-items:center;gap:10px;}
#tb-logo-img{height:20px;width:auto;display:none;object-fit:contain;}
#tb-logo-img.on{display:block;}
#canvas{position:absolute;top:44px;left:0;right:0;bottom:0;overflow:hidden;background:#fff;touch-action:none;}
#world{position:absolute;width:3000px;height:2000px;top:0;left:0;transform-origin:0 0;}

.proj{position:absolute;}
.proj-inner{position:relative;overflow:hidden;width:100%;height:100%;}
.proj-img,.proj-video{width:100%;height:100%;object-fit:cover;display:block;}

/* DETAIL */
#detail{position:fixed;inset:0;background:#fff;z-index:200;opacity:0;pointer-events:none;transition:opacity .4s;overflow-y:auto;-webkit-overflow-scrolling:touch;}
#detail.visible{opacity:1;pointer-events:all;}
#detail-bar{position:sticky;top:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:.5px solid #ebebeb;background:#fff;z-index:10;}
#detail-back{font-size:11px;letter-spacing:.1em;color:#999;text-transform:uppercase;background:none;border:none;font-family:'Univers',Arial,sans-serif;display:flex;align-items:center;gap:6px;padding:0;}
#detail-bar-logo{font-size:12px;letter-spacing:.22em;color:#111;text-transform:uppercase;}
#detail-body{padding:clamp(24px,4vw,56px) clamp(20px,5vw,80px) 100px;max-width:1100px;margin:0 auto;}
#d-title{font-size:clamp(18px,3vw,30px);font-weight:300;letter-spacing:.02em;color:#000;margin-bottom:10px;}
#d-intro{font-size:13px;line-height:1.85;color:#555;max-width:560px;margin-bottom:36px;}
#d-divider{width:100%;height:.5px;background:#ebebeb;margin-bottom:24px;}
#d-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.d-slot{background:#f4f4f4;overflow:hidden;}
.d-slot.wide{grid-column:span 2;}
.d-slot.landscape{aspect-ratio:16/9;}
.d-slot.square{aspect-ratio:1;}
.d-slot.tall{aspect-ratio:3/4;}
.d-slot img,.d-slot video{width:100%;height:100%;object-fit:cover;display:block;}
.d-slot video{background:#000;}

/* MOBILE */
@media(max-width:600px){
  body{cursor:auto;}
  #cur,#cur-tip{display:none;}
  #topbar,#detail-bar{padding:0 14px;}
  #detail-body{padding:20px 14px 80px;}
  #d-grid{grid-template-columns:1fr;gap:10px;}
  .d-slot.wide{grid-column:span 1;}
}
</style>
</head>
<body>

<div id="cur"></div>
<div id="cur-tip"><div id="ct-cat"></div><div id="ct-title"></div><div id="ct-year"></div></div>

<div id="loading"><div class="ld"></div><div class="ld"></div><div class="ld"></div></div>

<div id="intro">
  <div id="logo-wrap"
    onmouseenter="document.getElementById('intro').classList.add('hov');setArrow('#fff')"
    onmouseleave="document.getElementById('intro').classList.remove('hov');setArrow('#111')"
    onclick="enterPortfolio()"
    ontouchend="enterPortfolio()">
    <img id="logo-img" alt=""/><img id="logo-img-inv" alt=""/>
    <span id="logo-text">ARK</span>
  </div>
</div>

<div id="map">
  <div id="topbar">
    <div id="tb-logo" onclick="goToIntro()" style="cursor:none;"><img id="tb-logo-img" alt=""/><span id="tb-logo-text">ARK</span></div>
  </div>
  <div id="canvas"><div id="world"></div></div>
</div>

<div id="detail">
  <div id="detail-bar">
    <button id="detail-back" onclick="closeDetail()">← Lavori</button>
    <div id="detail-bar-logo">ARK</div>
  </div>
  <div id="detail-body">
    <div id="d-title"></div>
    <div id="d-intro"></div>
    <div id="d-divider"></div>
    <div id="d-grid"></div>
  </div>
</div>

<script>
const SUPA_URL='https://whqpztxvubdfvjwsuhod.supabase.co';
const SUPA_KEY='sb_publishable_Jgk-m2H0m9XVG1QFQbUjcw_PTbVrDLk';
let PROJECTS=[],settings={};
let tx=-80,ty=-40,sc=0.72,drag=false,sx,sy,stx,sty,moved=false;
const world=document.getElementById('world'),canvas=document.getElementById('canvas');

/* ── CURSORE ── */
const cur=document.getElementById('cur');
const tip=document.getElementById('cur-tip');

function setArrow(col){
  cur.style.background=col;
}

document.addEventListener('mousemove',e=>{
  cur.style.left=e.clientX+'px';
  cur.style.top=e.clientY+'px';
  tip.style.transform=`translate(${e.clientX+16}px,${e.clientY-8}px)`;
});

document.addEventListener('mousedown',()=>{
  cur.style.width='14px';
  cur.style.height='14px';
});
document.addEventListener('mouseup',()=>{
  cur.style.width='8px';
  cur.style.height='8px';
});

function showTip(p){
  document.getElementById('ct-cat').textContent=p.cat||'';
  document.getElementById('ct-title').textContent=p.title||'';
  document.getElementById('ct-year').textContent=p.year||'';
  tip.classList.add('on');
}
function hideTip(){tip.classList.remove('on');}

/* ── SUPABASE ── */
async function supa(ep,opts={}){
  try{
    const r=await fetch(SUPA_URL+'/rest/v1/'+ep,{
      headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json',...(opts.headers||{})},
      method:opts.method||'GET',body:opts.body
    });
    if(!r.ok)return null;const t=await r.text();return t?JSON.parse(t):null;
  }catch(e){return null;}
}

function isVid(u){return u&&/\.(mp4|webm|ogg|mov)(\?|$)/i.test(u);}
function mkMedia(url,cls){
  if(isVid(url)){const v=document.createElement('video');v.src=url;v.autoplay=v.loop=v.muted=v.playsInline=true;v.className=cls;return v;}
  const i=document.createElement('img');i.src=url;i.alt='';i.className=cls;return i;
}

/* ── LOAD ── */
async function loadData(){
  const[projs,sets]=await Promise.all([
    supa('projects?select=*&order=created_at.asc'),
    supa('settings?select=*')
  ]);
  PROJECTS=projs&&projs.length?projs:defaultProjects();
  if(sets)sets.forEach(s=>{settings[s.key]=s.value;});
  applySettings();
  document.getElementById('loading').classList.add('out');
}

function applySettings(){
  const name=settings['site_name']||'ARK';
  document.getElementById('tb-logo-text').textContent=name;
  document.getElementById('detail-bar-logo').textContent=name;
  document.title=name;
  if(settings['logo_url']){
    const u=settings['logo_url'];
    const li=document.getElementById('logo-img');li.src=u;li.classList.add('on');
    document.getElementById('logo-text').style.display='none';
    const tl=document.getElementById('tb-logo-img');tl.src=u;tl.classList.add('on');
    document.getElementById('tb-logo-text').style.display='none';
  }
  if(settings['logo_inv_url']){const l=document.getElementById('logo-img-inv');l.src=settings['logo_inv_url'];l.classList.add('on');}
}

/* ── MAPPA ── */
function buildWorld(){
  world.innerHTML='';
  PROJECTS.forEach(p=>{
    const el=document.createElement('div');el.className='proj';
    el.style.cssText=`left:${p.x||100}px;top:${p.y||100}px;width:${p.w||200}px;height:${p.h||150}px;`;
    const inner=document.createElement('div');inner.className='proj-inner';
    if(p.cover_url){inner.appendChild(mkMedia(p.cover_url,isVid(p.cover_url)?'proj-video':'proj-img'));}
    else{const ph=document.createElement('div');ph.style.cssText=`width:100%;height:100%;background:${p.bg||'#eee'};`;inner.appendChild(ph);}
    el.appendChild(inner);
    el.addEventListener('mouseenter',()=>{showTip(p);cur.classList.add('on-img');});
    el.addEventListener('mouseleave',()=>{hideTip();cur.classList.remove('on-img');});
    el.addEventListener('click',()=>{if(!moved){hideTip();tip.style.display='none';openDetail(p);}});
    world.appendChild(el);
  });
}

function applyT(){world.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;}

function enterPortfolio(){
  const intro=document.getElementById('intro');
  intro.classList.add('out');
  setTimeout(()=>{
    intro.style.display='none';
    document.getElementById('map').classList.add('visible');
    buildWorld();applyT();
  },400);
}

/* ── DETTAGLIO ── */
function openDetail(p){
  hideTip();
  tip.style.display='none';
  cur.classList.remove('on-img');
  document.getElementById('d-title').textContent=p.title||'';
  document.getElementById('d-intro').textContent=p.intro||'';
  const grid=document.getElementById('d-grid');grid.innerHTML='';
  let urls=[];try{urls=JSON.parse(p.gallery_urls||'[]');}catch(e){}
  let slots=[];try{slots=typeof p.slots==='string'?JSON.parse(p.slots||'[]'):(p.slots||[]);}catch(e){}
  const defs={'wide-landscape':'wide landscape','square':'square','tall':'tall','landscape':'landscape'};
  slots.forEach((type,i)=>{
    const slot=document.createElement('div');
    slot.className='d-slot '+(defs[type]||'square');
    if(urls[i])slot.appendChild(mkMedia(urls[i],''));
    else slot.style.background=p.bg||'#f0f0f0';
    grid.appendChild(slot);
  });
  document.getElementById('detail').scrollTop=0;
  document.getElementById('detail').classList.add('visible');
}
function closeDetail(){document.getElementById('detail').classList.remove('visible');tip.style.display='';}

/* ── MOUSE ── */
canvas.addEventListener('mousedown',e=>{drag=true;moved=false;sx=e.clientX;sy=e.clientY;stx=tx;sty=ty;});
window.addEventListener('mousemove',e=>{
  if(!drag)return;
  const dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.abs(dx)>4||Math.abs(dy)>4)moved=true;
  tx=stx+dx;ty=sty+dy;applyT();
});
window.addEventListener('mouseup',()=>{drag=false;});
canvas.addEventListener('wheel',e=>{e.preventDefault();sc=Math.max(.15,Math.min(3,sc+(e.deltaY>0?-.07:.07)));applyT();},{passive:false});

/* ── TOUCH ── */
let t0=null,t1=null,initDist=null,initSc=null;
function tdist(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);}
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  const ts=Array.from(e.touches);
  if(ts.length===1){drag=true;moved=false;t0=ts[0];sx=t0.clientX;sy=t0.clientY;stx=tx;sty=ty;}
  else if(ts.length===2){drag=false;t0=ts[0];t1=ts[1];initDist=tdist(t0,t1);initSc=sc;stx=tx;sty=ty;}
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  const ts=Array.from(e.touches);
  if(ts.length===1&&drag){
    const dx=ts[0].clientX-sx,dy=ts[0].clientY-sy;
    if(Math.abs(dx)>4||Math.abs(dy)>4)moved=true;
    tx=stx+dx;ty=sty+dy;applyT();
  }else if(ts.length===2&&initDist){
    const nd=tdist(ts[0],ts[1]);
    sc=Math.max(.15,Math.min(3,initSc*(nd/initDist)));
    const mx=(ts[0].clientX+ts[1].clientX)/2,my=(ts[0].clientY+ts[1].clientY)/2;
    const imx=(t0.clientX+t1.clientX)/2,imy=(t0.clientY+t1.clientY)/2;
    tx=stx+(mx-imx);ty=sty+(my-imy);applyT();
  }
},{passive:false});
canvas.addEventListener('touchend',e=>{
  e.preventDefault();
  const ts=Array.from(e.touches);
  if(ts.length===0){
    if(!moved&&e.changedTouches.length===1){
      const ct=e.changedTouches[0];
      const el=document.elementFromPoint(ct.clientX,ct.clientY);
      const proj=el&&el.closest('.proj');
      if(proj){const idx=Array.from(world.children).indexOf(proj);if(idx>=0&&PROJECTS[idx])openDetail(PROJECTS[idx]);}
    }
    drag=false;moved=false;t0=null;t1=null;initDist=null;
  }else if(ts.length===1){drag=true;t0=ts[0];sx=ts[0].clientX;sy=ts[0].clientY;stx=tx;sty=ty;initDist=null;}
},{passive:false});

/* ── DEFAULT ── */
function defaultProjects(){
  return[
    {id:'d1',title:'Rivista Forma',cat:'Editoriale',year:'2024',intro:'Art direction per una rivista di architettura e design.',cover_url:'',gallery_urls:'[]',slots:'["wide-landscape","square","square","wide-landscape"]',w:280,h:210,x:120,y:100,bg:'#e8e5e0'},
    {id:'d2',title:'Catalogo Sculture',cat:'Editoriale',year:'2023',intro:'Catalogo per una mostra di sculture contemporanee.',cover_url:'',gallery_urls:'[]',slots:'["wide-landscape","tall","tall"]',w:190,h:270,x:640,y:60,bg:'#f0ede8'},
    {id:'d3',title:'Film Doc Coste',cat:'Multimediale',year:'2023',intro:'Title sequence e motion graphics per documentario.',cover_url:'',gallery_urls:'[]',slots:'["wide-landscape","wide-landscape","square","square"]',w:360,h:230,x:200,y:560,bg:'#111'},
    {id:'d4',title:'Installazione Sonora',cat:'Multimediale',year:'2024',intro:'Visual per installazione in spazio urbano.',cover_url:'',gallery_urls:'[]',slots:'["wide-landscape","square","square","tall","tall"]',w:210,h:210,x:900,y:580,bg:'#0d0d0d'},
    {id:'d5',title:'Libro di Poesia',cat:'Editoriale',year:'2022',intro:'Progetto tipografico per raccolta poetica.',cover_url:'',gallery_urls:'[]',slots:'["tall","tall","wide-landscape","square","square"]',w:165,h:235,x:1280,y:520,bg:'#f8f8f8'},
    {id:'d6',title:'Motion Identity',cat:'Multimediale',year:'2023',intro:'Identità animata per festival culturale.',cover_url:'',gallery_urls:'[]',slots:'["wide-landscape","square","square","wide-landscape"]',w:270,h:190,x:1500,y:100,bg:'#0a0a0a'},
    {id:'d7',title:'Manifesto Tipo',cat:'Editoriale',year:'2024',intro:'Sperimentazione tipografica su grande formato.',cover_url:'',gallery_urls:'[]',slots:'["tall","tall","wide-landscape"]',w:195,h:280,x:1620,y:460,bg:'#f5f2ed'},
  ];
}
function goToIntro(){
  // Nascondi mappa e dettaglio
  document.getElementById('detail').classList.remove('visible');
  document.getElementById('map').classList.remove('visible');
  // Mostra intro
  const intro = document.getElementById('intro');
  intro.style.display = 'flex';
  intro.classList.remove('out');
  intro.classList.remove('hov');
  setArrow('#111');
}

loadData();
</script>
</body>
</html>
